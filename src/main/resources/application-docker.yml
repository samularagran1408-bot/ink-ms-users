spring:
  application:
    name: ink-ms-users
  
  datasource:
    url: jdbc:mysql://mysql:3306/user_ms?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: 
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format-sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB

server:
  port: 3002

auth:
  service:
    url: http://auth-service:3001

accessibility:
  service:
    url: ${ACCESSIBILITY_SERVICE_URL:http://accessibility-service:3004}

notifications:
  admin-emails: ${NOTIFICATION_ADMIN_EMAILS:}

sports:
  service:
    url: ${SPORTS_SERVICE_URL:http://sports-service:3003}

cloudinary:
  url: ${CLOUDINARY_URL:}
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}
  folder: inklusport/profiles

security:
  basic:
    enabled: false

logging:
  level:
    com.inklusport.users: DEBUG