spring:
  application:
    name: ink-ms-users

  datasource:
    url: jdbc:mysql://localhost:3306/user_ms?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: 
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format-sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB

server:
  port: 3002

jwt:
  secret: inklusport2024superSecretKeyForJWTtokenGenerationWith512bitsAlgorithmHS512
  expiration: 86400000

logging:
  level:
    com.inklusport.users: DEBUG

auth:
  service:
    url: http://localhost:3001

accessibility:
  service:
    url: ${ACCESSIBILITY_SERVICE_URL:http://localhost:3004}

notifications:
  admin-emails: ${NOTIFICATION_ADMIN_EMAILS:}

sports:
  service:
    url: ${SPORTS_SERVICE_URL:http://localhost:3003}

cloudinary:
  url: ${CLOUDINARY_URL:}
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}
  folder: inklusport/profiles
